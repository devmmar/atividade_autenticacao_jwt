spring.application.name=demo
spring.mail.from=${MAIL_FROM:localhost@localhost}
spring.mail.host=${MAIL_HOST:localhost}
security.jwt.secret=${JWT_SECRET:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# MySQL/MariaDB local (XAMPP) - usuario root sem senha
spring.datasource.url=jdbc:mysql://localhost:3306/projetoimobiliaria?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Upload de fotos dos imoveis
app.upload-dir=./uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
